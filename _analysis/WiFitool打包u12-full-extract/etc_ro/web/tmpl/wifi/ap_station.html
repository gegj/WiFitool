<div class="form-body"><div class="form-title" trans='ap_station'></div><div><div class="content"><div  class="row-fluid"><label class="span4  side-right" trans='ap_station_switch'></label><div class="span8"><input type="radio" name="ap_station_switch" id="ap_station_switch_enable" data-bind="checked: ap_station_enable" value="1"/><label for="ap_station_switch_enable" trans="enable"></label><input type="radio" name="ap_station_switch" id="ap_station_switch_disable" data-bind="checked: ap_station_enable" value="0"/><label for="ap_station_switch_disable" trans="disable"></label></div></div><div class="row-fluid" data-bind="visible:ap_station_enable_show()=='1'&& isSupportApDailPref"><label class="span4 side-right" trans='ap_station_wlan_mode'></label><div class="span8"><input type="radio" name="ap_station_mode" id="ap_station_mode_wifi" data-bind="checked: ap_station_mode" value="wifi_pref"/><label for="ap_station_mode_wifi" trans="ap_station_wifi_prior"></label><input type="radio" name="ap_station_mode" id="ap_station_mode_3g" data-bind="checked: ap_station_mode" value="dial_pref"/><label for="ap_station_mode_3g" trans="ap_station_3g_prior"></label></div></div></div><div class="form-buttons"><input id="btnApply" type="button" class="btn-1 " trans="apply" data-bind="click:apply"/></div></div><div data-bind="visible:pageState() == page.list"><div class="content"><div data-bind="visible:ap_station_enable_show()=='1'"><div class="form-title" trans="ap_station_hotspot_list"></div><div><input id="btnScan" type="button" class="btn-1 " trans="ap_scan" data-bind="click:searchHotspot"/><input id="btnAddNetwork" type="button" class="btn-1 " trans="ap_add_network" data-bind="click:openAddPage"/><input id="btnEdit" type="button" class="btn-1 " trans="ap_edit_network" data-bind="click:openAddListPage"/></div><div class="ko-grid-container" style="overflow:auto;margin-right: 10px;"><table cellPadding="0" cellSpacing="0" id="scanList" class="margin-top-15 table table-striped table-hover ko-grid colorHoverTable table-fixed" ><thead></thead><tbody data-bind="foreach:apSearchList"><tr data-bind="css:{odd:$index()%2==0,even:$index()%2==1},attr:{id:'scanlist_tr'+index}"><td ><label data-bind="text:ssid"></label><br/><label data-bind="text:authMode_show"></label></td><td ><img data-bind="attr:{src:imgSignal}"/></td><td style="padding-right: 10px;text-align: right"><input type="button" class="btn-1 " trans="connect" data-bind="attr:{id:'scanBtnConnect'+index},visible:connectStatus=='0'" onclick="connectAction(this)"/><input type="button" class="btn-1 " trans="disconnect" data-bind="attr:{id:'scanBtnDisconnect'+index},visible:connectStatus=='1'" onclick="disconnectAction(this)"/></td></tr></tbody></table></div></div></div></div><form id="frmAdd" data-bind="visible:pageState() == page.add || pageState() == page.edit"><div class="form-title" trans="ap_station_add_hotspot" data-bind="visible:pageState() == page.add"></div><div class="form-title" trans="ap_station_edit_hotspot" data-bind="visible:pageState() == page.edit"></div><div class="content"><div class="row-fluid"><label class="span4 side-right" for="txtSSID" trans='ssid_name'></label><div class="span8"><input type="text" name="txtSSID" id="txtSSID" class="required form-control" data-bind="value:ssid"  maxlength="32"/></div></div><div class="row-fluid"><label class="span4 side-right" for='mode' trans='security_mode'></label><div class="span8"><select class="form-control" transid='ap_station_security_mode' id="mode"data-bind="options: modes, value: authMode, optionsText: transOption('ap_station_security_mode'), optionsValue: 'value'"></select></div></div><div class="row-fluid" data-bind='visible: authMode() == "OPEN"'><label class="span4 side-right" for='selEncryptType' trans='ap_station_encrypt_type'></label><div class="span8"><select class="form-control" id="selEncryptType" data-bind="value: selectedencryptType, optionsValue: 'value'"><option value="NONE" trans="ap_station_encrypt_type_none"></option><option value="WEP" trans="ap_station_encrypt_type_wep"></option></select></div></div><div class="row-fluid"data-bind='visible:  (authMode() == "OPEN" && selectedencryptType() == "WEP") || authMode() == "SHARED"'><label class="span4 side-left" for='selWepKeyType' trans='ap_station_wep_default_key'></label><div class="span8"><select class="form-control" id="selWepKeyType" transid='ap_station_wep_key' data-bind="options: keyIDMode, value: keyID,optionsText: transOption('ap_station_wep_key'), optionsValue: 'value'"></select></div></div><div class="row-fluid" data-bind='visible: (authMode() == "OPEN" && selectedencryptType() == "WEP") || authMode() == "SHARED"'><label class="span4 side-right" for='txtWepKey' trans='ap_station_wep_key'></label><div class="span8"><input id='pwdWepKey' name="pwdWepKey" type="password" class="required form-control"data-bind="value: password,visible:!showPassword()" maxlength='26'/><input id='txtWepKey' name="txtWepKey" type="text" class="required form-control"data-bind="value: password,visible:showPassword()" maxlength='26'/><div class="margin-top-10"><p class="checkbox" data-bind="css:{'checkbox_selected': showPassword()}, click: showPasswordHandler" manualControl="true"><input id="showPassword" name="showPassword" type="checkbox" data-bind="checked: showPassword"/></p><label trans="display_password"></label></div><div id="lblshowWEPPassword" class="clear"></div></div></div><div class="row-fluid" data-bind='visible: authMode() == "WPAPSK" || authMode() == "WPA2PSK" || authMode() == "WPAPSKWPA2PSK"|| authMode() == "WPA2WPA3" '><label class="span4 side-left" trans='ap_station_cipher'></label><div class="span8"><div class="row"><div class="span4"><input name="cipher" id="cipher_TKIP" value="TKIP" type="radio"data-bind="checked: encryptType_WPA"><label for="cipher_TKIP" trans="ap_station_cipher_TKIP"></label></div><div class="span4"><input name="cipher" id="cipher_AES" value="CCMP" type="radio"data-bind="checked: encryptType_WPA"><label for="cipher_AES" trans="ap_station_cipher_AES"></label></div><div class="span4"><input name="cipher" id="cipher_AUTO" value="TKIPCCMP" type="radio"data-bind="checked: encryptType_WPA"><label for="cipher_AUTO" trans="ap_station_cipher_AUTO"></label></div></div></div></div><div class="row-fluid" data-bind='visible: authMode() == "WPAPSK" || authMode() == "WPA2PSK" || authMode() == "WPAPSKWPA2PSK" '><label class="span4 side-right" for='txtWPAKey' trans='pass_phrase'></label><div class="span8"><input id='pwdWPAKey' name="pwdWPAKey" type="password" class="required form-control"data-bind="value: password,visible:!showPassword()" maxlength='64'/><input id='txtWPAKey' name="txtWPAKey" type="text" class="required form-control"data-bind="value: password,visible:showPassword()" maxlength='64'/><div class="margin-top-10"><p class="checkbox" data-bind="css:{'checkbox_selected': showPassword()}, click: showPasswordHandler" manualControl="true"><input id="showWPAPassword" name="showWPAPassword" type="checkbox" data-bind="checked: showPassword"/></p><label trans="display_password"></label></div><div id="lblshowWPAPassword" class="clear"></div></div></div><div class="form-buttons"><input id="btnCancel" type="button" class="btn-1 " trans="cancel" data-bind="click:openListPage"/><input id="btnAdd" type="submit" class="btn-1 " trans="apply"/></div></div></form><div id="addListDiv" data-bind="visible:pageState() == page.addlist"><div class="form-title" trans="edit_internet_wifi_access_points"></div><div class="content"><!--<div trans="ap_station_note2" class="font13" style="line-height:20px"></div>--><div class="form-buttons"><input id="btnnext_step" type="button" class="btn-1 " trans="next_step_sort" onClick="wifiSpotSortNext('previous')" /><input id="btnPrevious"  type="button" class="btn-1 " trans="prev_step_sort" onClick="wifiSpotSortNext('next')" /></div><div class="ko-grid-container" style="overflow:auto;margin-right: 20px;"><table cellPadding="0" cellSpacing="0" id="addList" class=" margin-top-15 table table-striped table-hover ko-grid colorHoverTable table-fixed"><thead></thead><tbody data-bind="foreach:apAddList"><tr data-bind="css:{odd:$index()%2==0,even:$index()%2==1},attr:{id:'scanlist_tr'+index}"><td ><input type="radio" name="addListRadio" data-bind="attr:{id:'addListRadio'+index}"></label></td><td ><label data-bind="text:ssid"></label><br/><label data-bind="text:authMode_show"></label></td><td style="padding-right: 0px;text-align: right"><input type="button" class="btn-1 " trans="edit" data-bind="attr:{id:'addListBtnEdit'+index}" onclick="openAddListEditPage(this)"/><input type="button" class="btn-1 " trans="delete" data-bind="attr:{id:'addListBtnDel'+index}" onclick="deleteHotspot()"/></td></tr></tbody></table></div><div class="form-buttons"><input id="addCancel" type="button" class="btn-1 " trans="back" data-bind="click:openListPage"/></div></div></div></div>
