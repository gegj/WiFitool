rj45_notes_auto  = АВТО: түзүлүш WAN / LAN интерфейсинин адаптациялоочу режими катары иштейт, ал Ethernet интерфейси WAN интерфейси же LAN интерфейси катары иштеши керек экендигин, ал шайманды тышкы тармак менен байланыштырат. <br/> Ethernet интерфейси WAN интерфейси жана PPPoE ыкмасы менен иштегенде, колдонуучу интернет кызматын алуу үчүн колдонуучунун аты менен паролду толтурушу керек. <br/> Ethernet интерфейси WAN интерфейси катары иштегенде жана оператордун тармагы натыйжалуу IP дарегин DHCP Сервери катары автоматтык түрдө бөлүп бере алса, шайман автоматтык түрдө интернетти туташтыра алат, эч кандай параметр талап кылынбайт. Чындыгында, шайман DHCP Клиент катары иштейт жана оператордун тармагынан IP алат. <br/> PS: Эгерде түзүлүш интернетти ethernet интерфейси менен туташтырса, анда зымсыз байланыш жабылат. Демек, эгер колдонуучу зымсыз байланышка кайткысы келсе, анда ethernet туташуусун ажыратышы керек, же ethernet интерфейсинин иштешин LAN режиминде гана орнотушу керек.
rj45_notes_dhcp  = Ethernet интерфейси WAN режими катары иштейт. түзүлүш DHCP кардары катары иштейт жана оператордун тармагынан натыйжалуу IP дарегин алат жана интернетке туташат.
rj45_notes_static  = Статикалык: Ethernet интерфейси WAN режими катары иштейт. Колдонуучу IP дарегин жана шлюзду, DNS маалыматын кол менен киргизиши керек, бул маалымат оператордон алынышы керек, колдонуучу туруктуу IP дареги менен интернетке кире алат.
rj45_notes_pppoe  = PPPoE: Ethernet интерфейси WAN режими катары иштейт. Колдонуучу PPPoE колдонуучунун атын жана паролун киргизип, интернетке туташуусу керек.
rj45_notes_lan  = LAN гана: Ethernet интерфейси LAN режими катары иштейт. Компьютер жана ноутбук ушул LAN интерфейси аркылуу шайманга туташып, Wi-Fi кардары шайман менен байланышкан болсо, алардын бардыгы жергиликтүү тармакта иштешет. Аспап интернетти Ethernet интерфейси менен эмес, зымсыз байланыш аркылуу байланыштырат.
change_rj45mode_alert  = Эгерде сиз Терүү режимин өзгөртө турган болсоңуз, анда кабелди дагы бир жолу туташтырышыңыз керек, улантылсынбы?
