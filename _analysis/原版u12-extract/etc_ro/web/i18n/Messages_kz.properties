rj45_notes_auto = AUTO: The device works as WAN/LAN interface adaptive mode，it decide the ethernet interface should work as WAN interface or LAN interface according the manner through which the device connect with network outside. <br/>When ethernet interface work as WAN interface, and PPPoE manner, user need to fill up the username and password information to get internet service. <br/>When ethernet interface work as WAN interface, and the operator's network can allocate the effective IP address automatically as a DHCP Server, the device can connect internet automatically, no parameter need. In fact, the device work as DHCP Client, and get IP from operator's network.<br/>PS: If the device connect internet by ethernet interface, it will close the wireless connection.  So, if user want to return to wireless connection, he need to disconnect the ethernet connection, or set the ethernet interface work as LAN only mode.
rj45_notes_dhcp = Ethernet interface work as WAN mode. The device will work as a DHCP Client, and get the effective IP address from operator's network, and connect to internet.
rj45_notes_static = Static: Ethernet interface work as WAN mode. User has to input the IP address and gateway, DNS information manually, these information should be got from operator.User can access internet by fixed IP address.
rj45_notes_pppoe = PPPoE: Ethernet interface work as WAN mode. User need to input the username and password of PPPoE, and connect to internet.
rj45_notes_lan = LAN only: Ethernet interface work as LAN mode. The PC and laptop connect with the device by this LAN interface act as the same with the Wi-Fi client connect with the device,  all of them works in a local network. The device connect internet by wireless connection, not by ethernet interface.
