apn_note_dns_mode =DNS режімі: Егер тіркелген IP адресті қызметтердің провайдері берсе, DNS қолмен орнатуды таңдаңыз, кері жағдайда автоматты DNS таңдаңыз, құрылғы автоматты түрде параметрлер алады. 
apn_note_authentication =Аутентификация: бұл сіздің Интернет-провайдеріңізде (ISP) қамтамасыз етілген. Парольді аутентификациялау протоколы (PAP) пирге 2x басу арқылы өздерінің жеке басын анықтауға арналған шифрлаусыз оңай жолды ұсынады. Қатысушыларды қолмен тексеру аутентификациясының протоколы (CHAP) құрметті теңдестірушіні уақыттық растау үшін 3x түртумен қолданады.
apn_note_username = Пайдаланушының аты: Қосылыс орнатылғанда, пайдаланушының аты Интернет-провайдерден сәйкестендіруді алу үшін пайдаланылады.
apn_note_password =Пароль: Қосылыс орнатылғанда Интернет-провайдерден сәйкестендіруді алу үшін пайдаланылады.
apn_note_set_default =Бастапқы қалып бойынша профильді орнату үшін «Бастапқы қалып бойынша орнату» батырмасын басыңыз.

wifi_basic_note_multi_ssid_switch =Мульти SSID қайта қосылғышы: 2 SSID қайта қосылғышы бір уақытта пайдаланыла алады. (Егер Wi-Fi интернетінің опциясы қосылып тұрса, онда мульти-SSID сөндіріледі).
wifi_basic_note_network_name =Service Set Identifier (SSID) желісінің аты. Жолаққа сіздің сымсыз жергілікті желіңіз үшін атауы болатын 32-кем белгі енгізіңіз (WLAN).
wifi_basic_note_network_name_input =Желінің атауы 0-9 a-z А-Z! # () + -. /% =? @ ^ _ {|} ~ белгілерін қамтиды, бос орынмен басталмайды және аяқталмайды.
wifi_basic_note_broadcast =Желі атауын жіберу(SSID): осы қызметті қосу немесе сөндіру (бойынша). Қосылғаннан кейін маршрутизатор SSID таратады және де басқа құрылғылар тауып алып қосыла алады.
wifi_basic_note_security_mode =Қауіпсіздік режімі:
wifi_basic_note_no_encryption =Ашық: Аутентификация және шифрлеу орындалмайды. Жеке ақпарат ұрлану мүмкін немесе желі бөгде тұлғалармен пайдаланылуы мүмкін. Шифрлеудің бұл сұлбасын пайдаланбаған жөн.
wifi_basic_note_wpa_psk_aes = WPA2 (AES)-PSK: 802.11i стандартын жүзеге асыруымен WPA-дың қауіпсіз нұсқасы 
wifi_basic_note_wpa_psk = WPA-PSK/WPA2-PSK: WPA Pre-Shared Key (WPA-PSK). WPA2-PSK 802.11i стандартын жүзеге асыруымен WPA-дың қауіпсіз нұсқасы болып табылады.
wifi_basic_note_pass_phrase =Құпия сөз 0-9 a-z A-Z! # () + -. /% =? @ ^ _ {|} ~ 
wifi_basic_note_max_station_number =Құрылғының максималды саны: Қатынау нүктесіне бір уақытта қосыла алатын  құрылғылардың максималды санын таңдаңыз.

wifi_advanced_note_whole_page =Осы бетте Сіз Wi-Fi-дың қосымша белгілерін орната аласыз.
wifi_advanced_note_band_selection =Жиілікті таңдау: 2,4 ГГц немесе 5 ГГц жиілігін таңдаңыз.
wifi_advanced_note_network_mode =Желілік режім: егер барлық сымсыз құрылғылар осы құрылғыға сол режімде қосылса, сымсыз байланыстың тиісті режімін таңдаңыз.
wifi_advanced_note_country_code =Мемлекеттің/аумақтың коды: Мемлекеттің кодын дұрыс таңдаңыз.  Құрылғыны халықаралық деңгейде пайдаланғанда, өтінеміз, мемлекеттің/аумақтың кодын өзгертеңіз.
wifi_advanced_note_frequency =Жиілік (арна): өндірісті және сымсыз желінің қамтуын жетілдіру үшін керекті арнаны таңдаңыз.

ap_station_note_info =Өтінеміз, сіз қосылған Wi-Fi кіру нүктесінің IP адресі осы құрылғының IP адресі ауқымында емес екеніне көз жеткізіңіз. Әйтпесе, сіз Wi-Fi арқылы Интернетке кіре алмайсыз.
