lass="span4 side-right" trans="confirm_pin" for="txtConfirmPin"></label><div class="span8"><input id="txtConfirmPin" name="txtConfirmPin" type="password" data-bind="value: confirmPin"  class="required" maxlength="8"/></div></div></div><div data-bind="visible:pageState()<3"><div id="pinLeftMsg" class="row-fluid" data-bind="visible:pinNumber()!=1"><label class="span4 side-right"></label><div class="span8"><p class="important-prompt" data-bind="visible:pinNumber()>1"><span trans="attempts_left"></span><span data-bind='text:pinNumber'></span></p></div></div><div id="pinLastMsg" data-bind="visible:pinNumber()==1"><p class="important-prompt" trans="last_enter_pin"></p></div></div><div data-bind="visible:pageState()==3"><div id="pukLeftMsg" class="row-fluid" data-bind="visible:pukNumber()!=1"><label class="span4 side-right"></label><div class="span8"><p class="important-prompt" data-bind="visible:pukNumber()>1"><span trans="attempts_left"></span><span data-bind='text:pukNumber'></span></p></div></div><div id="pukLastMsg" data-bind="visible:pukNumber()==1"><p class="important-prompt" trans="last_enter_puk"></p></div></div></div><div class="form-buttons"><input type="submit" class="btn-1 " trans="apply" data-bind="disable:pageState()==0,css:{disabled:pageState()==0}" id="btnPinApply"/><input type="button" data-bind="click: cancel,visible:pageState()==2" class="btn-1 " trans="cancel"/></div></div><div><label class="colorRed" trans='connected_cannot_modify'></label></div><div id="puk_locked" class="important-prompt" trans="puk_locked" data-bind="visible:pageState()==4"></div><div class="form-note"><div class="notes-title">&nbsp;</div><ul class="notes-content"><li trans="diconneted_operate_note"></li><li trans="pin_note_info"></li><li trans="pin_note_times"></li><li trans="pin_note_operator"></li></ul></div></div></form>
