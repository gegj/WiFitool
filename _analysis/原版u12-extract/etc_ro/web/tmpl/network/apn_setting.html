<form id="apn_setting_form"><div class="form-body"><div class="form-title" trans="apn_setting"></div><div class="content"><div class="row-fluid"><label class="span4 side-right" trans="apn_currentApn"></label><label class="span8" data-bind="text: defApn"></label></div><div class="row-fluid"><label class="span4 side-right" trans="apn_mode"></label><div class="span8"><input type="radio" name="apnMode" id="apnMode_auto" data-bind="checked: apnMode, event: {click: apnModeChangeHandler}, disable: autoApnChecked() == false && disableProfile() == true" value="auto"/><label for="apnMode_auto" trans="apn_auto_apn"></label><input type="radio" name="apnMode" id="apnMode_manual" data-bind="checked: apnMode, event: {click: apnModeChangeHandler}, disable: autoApnChecked() == false && disableProfile() == true" value="manual"/><label for="apnMode_manual" trans="apn_manual_apn"></label></div></div><div id="apn_form_container" data-bind="visible: showAutoApnDetail()"><div class="row-fluid"><label class="span4 side-right" for="profile" trans="apn_profile"></label><div class="span8"><select name="autoProfile" id="autoProfile" data-bind="options: autoProfiles, value: selectedAutoProfile, optionsText: 'text', optionsValue: 'value', disable: disableProfile, event:{ change: autoProfileChangeHandler}, visible: apnMode() == 'auto'"></select><select name="profile" id="profile" data-bind="options: profiles, value: selectedProfile, optionsText: 'text', optionsValue: 'value', disable: disableProfile, event:{ change: profileChangeHandler}, visible: apnMode() == 'manual'"></select>&nbsp;<input type="button" data-bind="click: addAct, visible: autoApnChecked() == false && disableProfile() == false && hasCapacity() == true" class="btn-1 " trans="add_new"/><input type="button" data-bind="click: cancelAddAct, visible: autoApnChecked() == false && disableProfile() == true && hasCapacity() == true" class="btn-1 " trans="cancel"/></div></div><div class="row-fluid" data-bind="visible: supportIPv6()"><label or="apn_dns2_ipv4" data-bind="attr:{trans: transDns2}"></label><div class="span8"><input type="text" name="apn_dns2_ipv4" data-bind="value: dns2, disable: checkInputDisable" id="apn_dns2_ipv4" class="ipv4" maxlength="15"/></div></div><div class="row-fluid"><label class="span4 side-right" for="apn_authentication_ipv4" data-bind="attr:{trans: transAuth}"></label><div class="span8"><select name="apn_authentication_ipv4" id="apn_authentication_ipv4" data-bind="options: authModes, disable: checkInputDisable, value: selectedAuthentication, optionsText: 'text', optionsValue: 'value'"></select></div></div><div class="row-fluid"><label class="span4 side-right" for="apn_user_name_ipv4" data-bind="attr:{trans: transUserName}"></label><div class="span8"><input type="text" name="apn_user_name_ipv4" data-bind="value: username, disable: checkInputDisable" id="apn_user_name_ipv4" maxlength="64"/></div></div><div class="row-fluid"><label class="span4 side-right" for="apn_password_ipv4" data-bind="attr:{trans: transPassword}"></label><div class="span8"><input type="password" name="apn_password_ipv4" data-bind="value: password, disable: checkInputDisable" id="apn_password_ipv4" maxlength="64"/></div></div></div><!-- 以下是ipv6 --><div data-bind="visible: (selectedPdpType() == 'IPv4v6' && supportIpv4AndIpv6()) || selectedPdpType() == 'IPv6'"><div class="row-fluid"><label class="span4 side-right" for="apn_ipv6_apn" data-bind="attr:{trans: transApnV6}"></label><div class="span8"><input type="text" name="apn_ipv6_apn" data-bind="value: apnV6, disable: checkInputDisable" id="apn_ipv6_apn" class="required" maxlength="62"/></div></div><div class="row-fluid" data-bind="visible: showApnDns()"><label class="span4 side-right" data-bind="attr:{trans: transDnsModeV6}"></label><div class="span8"><input type="radio" name="dns_ipv6" id="apn_auto_dns_ipv6" data-bind="checked: dnsModeV6, disable: checkInputDisable" value="auto"/><label for="apn_auto_dns_ipv6" trans="apn_auto_dns"></label><input type="radio" name="dns_ipv6" id="apn_manual_dns_ipv6" data-bind="checked: dnsModeV6, disable: checkInputDisable" value="manual"/><label for="apn_manual_dns_ipv6" trans="apn_manual_dns"></label></div></div><div class="row-fluid" data-bind="visible: showDnsV6() && showApnDns()"><label class="span4 side-right" for="apn_dns1_ipv6" data-bind="attr:{trans: transDns1V6}"></label><div class="span8"><input type="text" name="apn_dns1_ipv6" id="apn_dns1_ipv6" data-bind="value: dns1V6, disable: checkInputDisable" class="required ipv6"/></div></div><div class="row-fluid" data-bind="visible: showDnsV6() && showApnDns()"><label class="span4 side-right" for="apn_dns2_ipv6" data-bind="attr:{trans: transDns2V6}"></label><div class="span8"><input type="text" name="apn_dns2_ipv6" id="apn_dns2_ipv6" data-bind="value: dns2V6, disable: checkInputDisable" class="ipv6"/></div></div><div class="row-fluid"><label class="span4 side-right" for="authentication_ipv6" data-bind="attr:{trans: transAuthV6}"></label><div class="span8"><select name="authentication_ipv6" id="authentication_ipv6" data-bind="options: authModes, disable: checkInputDisable, value: selectedAuthenticationV6, optionsText: 'text', optionsValue: 'value'"></select></div></div><div class="row-fluid"><label class="span4 side-right" for="apn_user_name_ipv6" data-bind="attr:{trans: transUserNameV6}"></label><div class="span8"><input type="text" name="apn_user_name_ipv6" data-bind="value: usernameV6, disable: checkInputDisable" id="apn_user_name_ipv6" maxlength="64"/></div></div><div class="row-fluid"><label class="span4 side-right" for="apn_password_ipv6" data-bind="attr:{trans: transPasswordV6}"></label><div class="span8"><input type="password" name="apn_password_ipv6" data-bind="value: passwordV6, disable: checkInputDisable" id="apn_password_ipv6" maxlength="64"/></div></div></div></div></div><div class="form-buttons"><input type="button" data-bind="click: setDefaultAct,visible: disableProfile() == false && setDefaultVisible()" class="btn-1
