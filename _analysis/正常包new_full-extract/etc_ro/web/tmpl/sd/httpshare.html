<div id="httpshare_form"><div class="form-body"><div class="form-title" trans="httpshare"></div><div class="content"><div class="row-fluid"><div class="span9"><span trans="sd_path" class="width20 side-center"></span><input type="text" class="width400" value="" id="sd_path" readonly="readonly" noAction="true" class="focusIn"/></div><div class="span3 side-right"><span id="sd_volumn"><span id="sd_volumn_used"></span>/<span id="sd_volumn_total"></span></span></div></div><div id="fileControlSection"><ul class="row-fluid"><li id="rootBtnLi" onclick="enterFolder('');" class="cursor-pointer marginleft5"><img class="sdcard_back_img" src="./img/backhome.jpg?v=1780628476765"/><span trans="root"></span></li><li id="backBtnLi" onclick="backFolder();" class="cursor-pointer marginleft5"><img class="sdcard_back_img" src="./img/back.jpg?v=1780628476765"/><span trans="back"></span></li><li id="newFolderBtnLi" onclick="openCreateNewFolderClickHandler();" class="cursor-pointer marginleft5"><img class="hand_cursor_img" src="./img/new.jpg?v=1780628476765"/><span trans="new"></span></li><li id="createNewFolderLi" style="display: none;line-height: 35px; vertical-align: middle;"><input type="text" name="newFolderName" id="newFolderName" maxlength="25"/><input type="button" id="createNewFolderBtn" trans="create" class="btn-1 " onclick="createNewFolderClickHandler();"/><input type="button" id="cancelCreateNewFolderBtn" trans="cancel" class="btn-1 " onclick="cancelCreateNewFolderClickHandler();"/><div id="createNewFolderErrorLabel" class="colorRed"></div></li></ul></div><div id="fileListSection"><table class="fileListTable colorHoverTable"><thead><tr><th width="40" class="sd_guest_hide_th"><p id="fileList-checkAll" target="fileList_container" class="checkbox checkboxToggle"><input id="checkbox-all" type="checkbox"/></p></th><th width="20"></th><th trans="sd_name" width="170"></th><th trans="sd_rename" class="sd_guest_hide_th"></th><th trans="download"></th><th trans="sd_file_size" ></th><th trans="sd_update_time" width="150"></th></tr></thead><tbody id="fileList_container"></tbody></table></div><div id="fileListButtonSection" class="row-fluid"><div class="pager span8"></div><div class="span4 side-right"><input type="button" trans="delete" id="delete_file_button" class="btn-1 " onclick="deleteBtnClickHandler();"/><input type="button" trans="back_to_login" id="go_to_login_button" class="btn-1 hide" onclick="gotoLogin();"/></div></div><div id="uploadSection"><iframe id="fileUploadIframe" name="fileUploadIframe" scrolling="no" frameborder="0" width="0" height="0" style="height:0px;width:0px;"></iframe><form method="post" name="fileUploadForm" id="fileUploadForm" action="" enctype="multipart/form-data" target="fileUploadIframe"><input type="hidden" name="path_SD_CARD_time" id="path_SD_CARD_time" value=""/><input type="hidden" name="path_SD_CARD_time_unix" id="path_SD_CARD_time_unix" value=""/><input id="fileField" name="filename" maxlength="200" type="file" dir="ltr"/><div class="fileUploadDiv"><input trans="upload" id="fileUploadApplyBtn" name="fileUploadApplyBtn" type="button" class="btn-1 marginleft5 margintop5 " onclick="fileUploadSubmitClickHandler();"/></div><div class="clear"></div></form></div></div><div class="form-note"><div class="notes-title">&nbsp;</div><ul class="notes-content"><li trans="note_upload_not_refresh"></li><li trans="note_upload_single_file_2g"></li></ul></div></div></div><script type="text/x-jquery-tmpl" id="sdFileItemTmpl">{{each(i, item) data }}<tr class="${trClass}">{{if readwrite}}<td align="center"><p class="checkbox"><input type="checkbox" target="fileList-checkAll" value="${fileName}"/></p></td>{{/if}}<td {{if fileType=='folder'}}class="cursor-pointer folderTd" filename='${fileName}'{{/if}}><span class="mini-icon ${fileType==''?'':'icon-'+fileType}"></span></td><td style="width:170px;" {{if fileType=='folder'}}class="cursor-pointer folderTd" filename='${fileName}'{{/if}}>${shortenLongName(replaceSpaceWithNbsp(fileName),20)}</td>{{if readwrite}}<td align='center'><a href="javascript: void(0)" filename='${fileName}' class="fileRename" trans='sd_rename'></a></td>{{/if}}<td align='center'>{{if fileType!='folder'}}<a href="${filePath}" filelocal="${filePath}" target="_blank" rel="noopener noreferrer" class="mini-icon icon-download"></a>{{/if}}</td><td align='center'>${fileSize}</td><td align='center'>${lastUpdateTime}</td></tr>{{/each}}</script><script type="text/x-jquery-tmpl" id="pagerTmpl">{{each(i, item) data.pagers }}{{if isPrev}}{{if pageNum==0}}<a href="javascript:void(0)" class="pager_disabled" trans="prev_page" onclick="javascript:void(0)"></a>{{else}}<a href="javascript:void(0)" trans="prev_page" onclick="pagerItemClickHandler('${pageNum}')"></a>{{/if}}{{else isDot}}<span>...</span>{{else isNext}}{{if pageNum - 1==data.total}}<a href="javascript:void(0)" class="pager_disabled" trans="next_page" onclick="javascript:void(0)"></a>{{else}}<a href="javascript:void(0)" trans="next_page" onclick="pagerItemClickHandler('${pageNum}')"></a>{{/if}}{{else}}<a href="javascript:void(0)" class="${isActive?'pager_active':''}" onclick="pagerItemClickHandler('${pageNum}')">${pageNum}</a>{{/if}}{{/each}}</script>
