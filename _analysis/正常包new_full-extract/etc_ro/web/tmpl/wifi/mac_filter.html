<div class="form-body"><div class="form-title" trans='mac_filter'></div><div class="form-body" data-bind="visible: isShowSSIDInfoDiv"><form id='macFilterForm'><div class="content"><div class="row-fluid"><label class="span4 side-right" trans='black_list_switch'></label><div class="span8"><input type="radio" name="mac_filter_switch" id="mac_filter_switch_enable"data-bind="checked: macFilterEnable" value="2"/><label for="mac_filter_switch_enable" trans="enable"></label><input type="radio" name="mac_filter_switch" id="mac_filter_switch_disable"data-bind="checked: macFilterEnable" value="0"/><label for="mac_filter_switch_disable" trans="disable"></label></div></div><div class="form-buttons"><input type="submit" class="btn-1 " trans='apply' /></div></div></form><div data-bind="visible: blackListEnabled"><form id="setBlackListFrm"><div class="content"><div class="row-fluid hide"><label class="span4 side-right" for="txtMacAddrName" trans="host_name"></label><div class="span6"><input type="text" name="txtMacAddrName" id="txtMacAddrName" class="required form-control" data-bind="value: macAddressName"  maxlength="32"/></div></div><div class="row-fluid"><label class="span4 side-right" for="txtMacAddress" trans="mac_address"></label><div class="span6"><input type="text" name="txtMacAddress" id="txtMacAddress" class="required form-control" data-bind="value: macAddress"  maxlength="17"/><label trans="macExam" id="macExamLabel"></label></div></div></div><div class="form-buttons"><input type="submit" class="btn-1 " trans="apply"  id="MAC_input_apply_id"/></div></form><div class="content"><div class="ko-grid-container marginnone"><table cellPadding="0" cellSpacing="0" class="ko-grid colorHoverTable marginnone"><thead><tr><th width="60" trans="station_number"></th><th width="200" trans="host_name"></th><th width="200" trans="mac_address"></th><th width="100" trans=""></th></tr></thead><tbody data-bind="foreach:blackList" id="blacklist"><tr data-bind="css:{odd:$index()%2==1, even:$index()%2==0}"><td data-bind="text:$index()+1"></td><td data-bind="text:hostName"></td><td data-bind="text:macAddress"></td><td><input type="button" class="btn-1 " trans='delete' onClick="removeFromBlackList($(this).attr('id'))" data-bind="attr:{id:$index()}" /></td></tr></tbody></table></div></div><div class="content"><div class="form-title" trans="station_info"></div><div class="ko-grid-container marginnone"><table cellPadding="0" cellSpacing="0" id="tabStation" class="ko-grid colorHoverTable marginnone"><thead><tr><th width="60" trans="station_number"></th><th width="200" trans="host_name"></th><th width="200" trans="mac_address"></th><th width="100"></th></tr></thead><tbody data-bind="foreach:deviceInfo" id="deviceInfo"><tr data-bind="css: {odd: $index() % 2 == 0, even: $index() % 2 != 0}"><td data-bind="text:$index()+1"></td><td data-bind="text:hostName"></td><td data-bind="text:macAddress"></td><td><input type="button" class="btn-1 " trans='block' onClick="addToBlackList($(this).attr('mac'),$(this).attr('ip'),$(this).attr('id'),$(this).attr('hostName'))" data-bind="enable:enabled,attr:{hostName:hostName,mac:macAddress,ip:ipAddress,id:'block'+$index()}"/></td></tr></tbody></table></div></div></div></div></div>
